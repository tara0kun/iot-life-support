name: tests

# 本番 Pi は dev ブランチで動いているので dev を主対象にする。
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: テスト
        run: python -m pytest -q

  pii:
    # 個人情報チェックは照合データ（.env と persons テーブル）が無いと
    # 成立しないため、CI では「チェックが成立しないこと」を検知するだけにする。
    # フェイルクローズの実装どおり exit 1 になるのが正しい挙動。
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 照合データが無い環境でフェイルクローズすること
        run: |
          if python scripts/check_no_pii.py README.md; then
            echo "::error::照合データが無いのに素通りした。フェイルクローズが壊れている"
            exit 1
          fi
          echo "フェイルクローズを確認"

      - name: 明らかな秘密が混入していないこと
        run: |
          # .env や DB が追跡されていないかだけを見る（値の照合は Pi 側のフックの仕事）
          if git ls-files | grep -qE '(^|/)\.env$|\.db$|\.sqlite3?$'; then
            echo "::error::.env か DB が追跡されている"
            git ls-files | grep -E '(^|/)\.env$|\.db$|\.sqlite3?$'
            exit 1
          fi
          if git ls-files '*.jpg' '*.jpeg' '*.png' | grep -v 'icon-'; then
            echo "::error::画像が追跡されている（実機の画面や写真の可能性）"
            exit 1
          fi
          echo "追跡ファイルに明らかな秘密なし"
