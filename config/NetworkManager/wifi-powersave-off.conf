# Wi-Fi の省電力を切る。
#
# **これが on だと SSH が作業中に切れる。** Wi-Fi チップがパケットの合間に
# スリープし、数百ms〜数秒の停止が起きる。長時間つなぎっぱなしの TCP
# （SSH / VSCode のリモート接続）はこれで落ちる。
#
# 実測（2026-10-24、祖母宅の Pi）:
#   iw dev wlan0 get power_save  → Power save: on
#   wlan0 state DORMANT（省電力で寝ている）
#   signal -66 dBm / rx 26.0 Mbit/s（2.4GHz、IODATA-3c0d18-2G）
#   Tailscale の経路張り替えが2日で77件、DERP 中継の張り替え24件、
#   リンク状態の変化16件 → 安定した回線ならこの頻度にはならない
#
# NetworkManager の powersave の値:
#   0=default（Raspberry Pi OS では on になる） / 1=ignore / 2=disable / 3=enable
# 常時稼働の見守り機なので、消費電力より接続の安定を取る。
[connection]
wifi.powersave = 2
