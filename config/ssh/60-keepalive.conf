# SSH の生存確認。回線が一時的に切れたときに、死んだ接続を掴み続けない。
#
# 既定は ClientAliveInterval 0 = サーバから生存確認を送らない。その状態で
# 回線が切れると、復帰後も TCP が死んだまま残り、作業が止まったように見える。
#
# 30秒ごとに確認し、6回連続で失敗（= 3分）まで粘る。Wi-Fi の瞬断や
# Tailscale の経路張り替え（実測で2日に77件）は数秒で復帰するので、
# 3分あれば取りこぼさない。それを超えたら接続を畳んで、
# クライアント側に再接続させる。
#
# 本体の sshd_config は 12行目で sshd_config.d/*.conf を Include していて、
# sshd は同じキーワードの**最初の**出現を採用する。つまりこのドロップインが
# 98〜102行目の既定値より優先される。
ClientAliveInterval 30
ClientAliveCountMax 6
TCPKeepAlive yes
